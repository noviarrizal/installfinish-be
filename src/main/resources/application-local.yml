# Local development. Defaults target the PostgreSQL container from compose.yaml; a git-ignored .env file in the
# working directory may override them (see .env.example).
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/installfinish}
    username: ${DATABASE_USERNAME:installfinish}
    password: ${DATABASE_PASSWORD:installfinish}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Generated by scripts/dev-jwt.sh (git-ignored). Never use this key outside local development.
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:.local/jwt/dev-public.pem}
          audiences: ${JWT_AUDIENCE:installfinish-api}

installfinish:
  security:
    public-api-docs: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
