# Shared configuration. Environment-specific values live in application-{local,test,prod}.yml.
# Secrets are never stored here; they are supplied through environment variables (see .env.example).
spring:
  application:
    name: installfinish-be
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Neon: point FLYWAY_URL at the direct (non-pooled) endpoint if DATABASE_URL uses the -pooler host.
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    time-zone: UTC
    # Jackson 3 moved date handling to DateTimeFeature (spring.jackson.datatype.datetime.*).
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      # Jackson 3 sorts properties alphabetically by default; keep declaration order (unchanged API output).
      sort-properties-alphabetically: false
  data:
    web:
      pageable:
        default-page-size: 25
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: false # ApiExceptionHandler owns all error responses
  web:
    error:
      # Fallback /error responses never expose internals (Spring Boot 4 moved these from server.error.*).
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    build:
      enabled: true

springdoc:
  paths-to-match: /api/**
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

installfinish:
  security:
    # JWT claim holding InstallFinish staff roles (SYSTEM_ADMIN, OPERATOR, QUALITY_REVIEWER).
    staff-roles-claim: ${JWT_STAFF_ROLES_CLAIM:installfinish_roles}
    public-api-docs: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
