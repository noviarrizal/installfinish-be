# Local development database. Credentials here are for a disposable local container only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: installfinish
      POSTGRES_USER: installfinish
      POSTGRES_PASSWORD: installfinish
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U installfinish -d installfinish"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
